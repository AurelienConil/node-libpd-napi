<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
    <title>KICK me</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Now&display=swap');
        
        /* Variables */
        :root {
            --color-bg: #000033;
            --color-grid: rgba(255, 105, 180, 0.15);
            --color-pink: #ff6ac1;
            --color-cyan: #00ffff;
            --color-purple: #b967ff;
            --color-yellow: #fcee0c;
            --font-main: 'Helvetica Now', 'Helvetica Neue', Arial, sans-serif;
        }
        
        /* Global Styles */
        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            background-image: 
                linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--color-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Vaporwave Elements */
        .sun {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(to top, var(--color-pink), var(--color-yellow));
            border-radius: 50%;
            bottom: 60%;
            left: calc(50% - 75px);
            z-index: -2;
            box-shadow: 0 0 60px var(--color-pink);
        }
        
        .grid-horizon {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, var(--color-purple), transparent);
            background-image: 
                linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
                linear-gradient(to top, var(--color-grid) 1px, transparent 1px);
            background-size: 100px 20px;
            background-position: center;
            perspective: 400px;
            transform: rotateX(60deg);
            transform-origin: bottom;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 40px;
            z-index: 1;
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Title Styles - Swiss + Vaporwave */
        .title {
            font-size: 5rem;
            text-align: center;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0;
            background: linear-gradient(90deg, var(--color-cyan), var(--color-pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            position: relative;
            text-shadow: 3px 3px 0px rgba(255, 105, 180, 0.3);
        }
        
        .title::after {
            content: "KICK me";
            position: absolute;
            left: 3px;
            top: 3px;
            -webkit-text-fill-color: rgba(0, 255, 255, 0.4);
            z-index: -1;
        }

        /* Sliders Container */
        .sliders-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 350px;
            gap: 80px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3),
                        inset 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        
        .sliders-container::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid var(--color-pink);
            z-index: -1;
            pointer-events: none;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            width: 100px;
        }

        .slider-label {
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .value-display {
            margin-top: 20px;
            background-color: black;
            border: 1px solid var(--color-purple);
            padding: 8px 15px;
            min-width: 60px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            color: var(--color-yellow);
        }

        /* Vertical sliders */
        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 4px;
            height: 250px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 0;
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            transform: rotate(180deg);
            transform-origin: center;
            margin: 0 20px;
        }

        .vertical-slider::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 0;
            bottom: 0;
            width: 24px;
            background: linear-gradient(to right, 
                               transparent, 
                               rgba(255, 105, 180, 0.5) 50%,
                               transparent);
            pointer-events: none;
        }

        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 4px;
            background: var(--color-pink);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px var(--color-pink);
        }

        /* Switch styling */
        .switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: black;
            border: 1px solid var(--color-cyan);
            transition: .4s;
            border-radius: 0;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 0;
        }

        input:checked + .slider {
            background-color: black;
            border: 1px solid var(--color-pink);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
            background-color: var(--color-pink);
        }

        .status-text {
            margin-left: 10px;
            color: var(--color-cyan);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="sun"></div>
    <div class="grid-horizon"></div>
    
    <div class="container">
        <h1 class="title">KICK me</h1>
        
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="audio-toggle" checked>
                <span class="slider"></span>
            </label>
            <span class="status-text" id="status">On</span>
        </div>
        
        <div class="sliders-container">
            <div class="slider-wrapper">
                <div class="slider-label">Speed</div>
                <input type="range" class="vertical-slider" id="speed-slider" min="200" max="1000" value="500">
                <div class="value-display" id="speed-value">500</div>
            </div>
            
            <div class="slider-wrapper">
                <div class="slider-label">Filter</div>
                <input type="range" class="vertical-slider" id="filter-slider" min="20" max="1000" value="300">
                <div class="value-display" id="filter-value">300</div>
            </div>
            
            <div class="slider-wrapper">
                <div class="slider-label">Cutoff</div>
                <input type="range" class="vertical-slider" id="cutoff-slider" min="50" max="500" value="200">
                <div class="value-display" id="cutoff-value">200</div>
            </div>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>

</html>
